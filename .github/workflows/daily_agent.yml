name: Daily Agent (manual only)

# Desativado como cron diario — logica de analise AI incorporada ao Weekly Review.
# Mantido para execucao manual quando necessario (ex: investigar anomalia pontual).

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry-run (nao aplica mudancas)"
        type: boolean
        default: true
      no_recalibrate:
        description: "Pular recalibracao"
        type: boolean
        default: false

jobs:
  daily-agent:
    name: Analise Manual + Recalibracao
    runs-on: ubuntu-latest

    steps:
      - name: Run daily_agent.py no Oracle via SSH
        uses: appleboy/ssh-action@v1
        with:
          host:     ${{ secrets.ORACLE_HOST }}
          username: ${{ secrets.ORACLE_USER }}
          key:      ${{ secrets.ORACLE_SSH_KEY }}
          timeout:  30m
          script: |
            cd ${{ secrets.ORACLE_PROJECT_PATH }}

            echo ">> Atualizando repositorio..."
            git pull --ff-only origin main || echo "AVISO: git pull falhou, continuando com versao atual"

            echo ">> Copiando scripts para o container..."
            docker cp scripts/ cctb_app:/app/scripts/ || echo "AVISO: docker cp falhou"

            DRY_RUN_FLAG=""
            if [ "${{ inputs.dry_run }}" = "true" ]; then
              DRY_RUN_FLAG="--dry-run"
            fi

            NO_RECAL_FLAG=""
            if [ "${{ inputs.no_recalibrate }}" = "true" ]; then
              NO_RECAL_FLAG="--no-recalibrate"
            fi

            echo ">> Rodando daily_agent.py $DRY_RUN_FLAG $NO_RECAL_FLAG..."
            docker exec \
              -e ANTHROPIC_API_KEY=${{ secrets.ANTHROPIC_API_KEY }} \
              -e DISCORD_WEBHOOK_URL=${{ secrets.DISCORD_REVIEW_WEBHOOK_URL }} \
              cctb_app \
              python scripts/daily_agent.py \
                --oracle-url http://localhost:8001 \
                $DRY_RUN_FLAG \
                $NO_RECAL_FLAG

            echo ">> Verificando mudancas nos modelos..."
            if git diff --quiet data/models/ 2>/dev/null; then
              echo "Nenhuma mudanca -- commit ignorado."
            else
              git config user.name  "github-actions[bot]"
              git config user.email "github-actions[bot]@users.noreply.github.com"
              git add data/models/ data/agent/
              git commit -m "chore: daily agent manual $(date -u '+%Y-%m-%d') -- recalibracao + analise LLM"
              git push origin main
              echo ">> Modelos atualizados e commitados."
            fi

            echo "OK Daily agent concluido: $(date -u)"
