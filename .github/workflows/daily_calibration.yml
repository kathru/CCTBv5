name: Daily Calibration

on:
  schedule:
    - cron: "0 2 * * *"   # 02:00 UTC todos os dias
  workflow_dispatch:        # permite rodar manualmente pelo GitHub

jobs:
  calibrate:
    name: Incremental Calibration
    runs-on: ubuntu-latest
    permissions:
      contents: write       # necessário para push do calibration_coef.json

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # Instala deps mínimas para CI (sem fastapi/uvicorn/pytest/pyright)
      - name: Install dependencies
        run: pip install -r requirements_ci.txt

      # Restaura banco SQLite do cache entre runs
      - name: Restore calibration DB
        id: cache-db
        uses: actions/cache@v4
        with:
          path: data/calibration.db
          key: calibration-db-${{ runner.os }}
          restore-keys: calibration-db-

      # Se banco não existe OU está corrompido, deleta para começar do zero
      - name: Bootstrap DB from JSON cache (first run or corrupted)
        run: |
          if [ ! -f data/calibration.db ]; then
            echo "Banco não encontrado — bootstrap via cache JSON..."
          else
            # Verifica integridade do banco
            if ! python -c "import sqlite3; c=sqlite3.connect('data/calibration.db'); c.execute('PRAGMA integrity_check').fetchone(); print('DB OK')" 2>/dev/null; then
              echo "Banco corrompido — removendo e recriando..."
              rm -f data/calibration.db
            else
              echo "Banco OK — skip bootstrap"
              exit 0
            fi
          fi
          python scripts/recalibrate.py --from-cache
        env:
          PYTHONPATH: .

      # Calibração: bootstrap do JSON (sempre) + novos candles da OKX
      - name: Run incremental calibration
        run: |
          set -x
          echo "=== ENV DEBUG ==="
          python --version
          pwd
          ls -la data/ || true
          ls data/cache/ | head -6 || true
          echo "DB size: $(du -sh data/calibration.db 2>/dev/null || echo 'N/A')"
          echo "=== BOOTSTRAP from JSON cache ==="
          python scripts/recalibrate.py --from-cache
          echo "=== INCREMENTAL (novos candles OKX) ==="
          python scripts/recalibrate.py --incremental
        env:
          PYTHONPATH: .

      # Roda WFO — timeout 8min para não travar o job; continua mesmo se falhar
      - name: Run Walk-Forward Optimization
        continue-on-error: true
        timeout-minutes: 8
        run: python scripts/walk_forward.py --auto-apply
        env:
          PYTHONPATH: .

      # Persiste banco atualizado no cache
      - name: Save calibration DB to cache
        uses: actions/cache/save@v4
        with:
          path: data/calibration.db
          key: calibration-db-${{ runner.os }}-${{ github.run_id }}

      # Verifica se houve mudança nos modelos (calibração e/ou WFO)
      - name: Check for changes
        id: changes
        run: |
          git diff --quiet data/models/ && \
            echo "changed=false" >> $GITHUB_OUTPUT || \
            echo "changed=true" >> $GITHUB_OUTPUT

      # Commita e faz push se houve atualização
      - name: Commit updated models
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/models/
          # Detecta se WFO atualizou coeficientes
          if git diff --staged --quiet data/models/calibration_coef.json; then
            MSG="chore: recalibração incremental $(date -u '+%Y-%m-%d')"
          else
            MSG="chore: recalibração + WFO auto-apply $(date -u '+%Y-%m-%d')"
          fi
          git commit -m "$MSG"
          git push

      # Deploy no Oracle via SSH
      - name: Deploy to Oracle
        if: steps.changes.outputs.changed == 'true'
        uses: appleboy/ssh-action@v1
        with:
          host:     ${{ secrets.ORACLE_HOST }}
          username: ${{ secrets.ORACLE_USER }}
          key:      ${{ secrets.ORACLE_SSH_KEY }}
          script: |
            cd ${{ secrets.ORACLE_PROJECT_PATH }}
            git pull
            sudo docker compose restart cctb
            echo "Deploy concluído: $(date -u)"

      - name: Skip deploy (no changes)
        if: steps.changes.outputs.changed == 'false'
        run: echo "Calibração sem mudanças — deploy ignorado."
