[project]
name = "cctbv5"
version = "5.0.0"
requires-python = ">=3.11"

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "basic"       # gradual: basic now, strict later
venvPath = "."
venv = ".venv"
include = ["src", "tests"]
exclude = ["**/__pycache__"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = [
    "E501",   # line too long (handled by formatter)
    "B008",   # do not perform function calls in argument defaults
    "UP007",  # use X | Y for union (keep Optional for clarity)
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B", "E"]   # more relaxed in tests

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
