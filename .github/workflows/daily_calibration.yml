name: Daily Calibration

on:
  schedule:
    - cron: "0 2 * * *"   # 02:00 UTC todos os dias
  workflow_dispatch:        # permite rodar manualmente pelo GitHub

jobs:
  calibrate:
    name: Incremental Calibration (1H)
    runs-on: ubuntu-latest
    permissions:
      contents: write       # necessário para push do calibration_coef.json

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements_ci.txt

      # Cache do banco SQLite entre runs.
      # Chave inclui "1h" para forçar cache limpo após migração de 30m → 1H.
      - name: Restore calibration DB
        id: cache-db
        uses: actions/cache@v4
        with:
          path: data/calibration.db
          key: calibration-db-1h-v2.5.0-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            calibration-db-1h-v2.5.0-${{ runner.os }}-

      # Bootstrap: só roda se o banco não existe ou está corrompido.
      # Usa o cache JSON dos candles 1H já baixados no repo.
      - name: Bootstrap DB (somente se ausente ou corrompido)
        run: |
          if [ -f data/calibration.db ]; then
            echo "Verificando integridade do banco..."
            if python -c "
          import sqlite3, sys
          try:
              c = sqlite3.connect('data/calibration.db')
              result = c.execute('PRAGMA integrity_check').fetchone()
              sys.exit(0 if result and result[0] == 'ok' else 1)
          except Exception:
              sys.exit(1)
          " 2>/dev/null; then
              echo "Banco OK — bootstrap ignorado."
            else
              echo "Banco corrompido — removendo e recriando do cache 1H..."
              rm -f data/calibration.db
              python scripts/recalibrate.py --from-cache --gran 1H
            fi
          else
            echo "Banco ausente — criando do cache 1H..."
            python scripts/recalibrate.py --from-cache --gran 1H
          fi
        env:
          PYTHONPATH: .

      # Calibração: rebuild completo se DB é novo (cache miss = pesos mudaram),
      # incremental se DB já existe com amostras v2.5.0.
      # v2.5.0: M9 adicionado — rebuild obrigatório na primeira run após cache miss.
      - name: Calibration (rebuild se DB novo, incremental se já existir)
        run: |
          if [ "${{ steps.cache-db.outputs.cache-hit }}" == "true" ]; then
            echo "Cache hit — calibração incremental (pesos já corretos)"
            python scripts/recalibrate.py --incremental --gran 1H
          else
            echo "Cache miss — rebuild completo com pesos v2.5.0"
            python scripts/recalibrate.py --rebuild --gran 1H
          fi
        env:
          PYTHONPATH: .

      # WFO: testa robustez com walk-forward em dados 1H.
      # continue-on-error: não falha o job se WFO não encontrar edge suficiente.
      - name: Walk-Forward Optimization (1H)
        continue-on-error: true
        timeout-minutes: 10
        run: python scripts/walk_forward.py --auto-apply
        env:
          PYTHONPATH: .

      # Persiste banco atualizado no cache para o próximo run.
      - name: Save calibration DB
        uses: actions/cache/save@v4
        if: always()
        with:
          path: data/calibration.db
          key: calibration-db-1h-v2.5.0-${{ runner.os }}-${{ github.run_id }}

      # Verifica se houve mudança nos modelos.
      - name: Check for model changes
        id: changes
        run: |
          git diff --quiet data/models/ && \
            echo "changed=false" >> $GITHUB_OUTPUT || \
            echo "changed=true" >> $GITHUB_OUTPUT

      # Commita e faz push se houve atualização dos modelos.
      - name: Commit updated models
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/models/
          if git diff --staged --quiet data/models/calibration_coef.json; then
            MSG="chore: recalibração incremental 1H $(date -u '+%Y-%m-%d')"
          else
            MSG="chore: recalibração + WFO auto-apply 1H $(date -u '+%Y-%m-%d')"
          fi
          git commit -m "$MSG"
          git push

      # Deploy no Oracle: descarta mudanças locais no modelo antes do pull,
      # depois reinicia o container (que lê o modelo do volume montado).
      - name: Deploy to Oracle
        if: steps.changes.outputs.changed == 'true'
        uses: appleboy/ssh-action@v1
        with:
          host:     ${{ secrets.ORACLE_HOST }}
          username: ${{ secrets.ORACLE_USER }}
          key:      ${{ secrets.ORACLE_SSH_KEY }}
          script: |
            cd ${{ secrets.ORACLE_PROJECT_PATH }}
            # Descarta qualquer mudanca local no modelo (gerada por calibracao direta)
            git checkout -- data/models/ 2>/dev/null || true
            git pull --ff-only || true
            # Copia calibration_coef.json atualizado para o container
            docker cp data/models/calibration_coef.json cctb_app:/app/data/models/calibration_coef.json || true
            # Reinicia o container para recarregar os modelos
            docker restart cctb_app
            echo "Deploy concluido: $(date -u)"

      - name: Skip deploy (no changes)
        if: steps.changes.outputs.changed == 'false'
        run: echo "Calibração sem mudanças nos modelos — deploy ignorado."
