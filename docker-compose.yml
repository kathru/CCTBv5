services:
  postgres:
    image: postgres:16-alpine
    container_name: cctb_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cctb}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cctb_secret}
      POSTGRES_DB: ${POSTGRES_DB:-cctbv5}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cctb} -d ${POSTGRES_DB:-cctbv5}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: cctb_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  postgres_data:
  redis_data:
