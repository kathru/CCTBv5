services:

  postgres:
    image: postgres:16-alpine
    container_name: cctb_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cctb}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cctb_secret}
      POSTGRES_DB: ${POSTGRES_DB:-cctbv5}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cctb} -d ${POSTGRES_DB:-cctbv5}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: cctb_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  cctb:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cctb_app
    ports:
      - "8001:8001"
    env_file:
      - .env
    environment:
      # Override localhost → docker service names
      DATABASE_URL: postgresql+asyncpg://cctb:cctb_secret@postgres:5432/cctbv5
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./logs:/app/logs      # persist logs on host
      - ./data:/app/data      # persist calibration files
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 30s
      timeout: 10s
      start_period: 20s
      retries: 3
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
